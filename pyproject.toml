[project]
name = "vds-lite-agent"
version = "0.1.0"
description = "Standalone CSV + LLM pandas data analysis agent MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "openpyxl",
  "pandas",
  "pydantic",
  "python-multipart",
  "uvicorn",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
